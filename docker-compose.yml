version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: hubflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hubflow
      POSTGRES_USER: hubflow
      POSTGRES_PASSWORD: hubflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  backend:
    build:
      context: ./backend
    container_name: hubflow-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg://hubflow:hubflow@db:5432/hubflow
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    container_name: hubflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
    container_name: hubflow-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"

volumes:
  postgres-data:

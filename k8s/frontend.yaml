apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubflow-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hubflow-frontend
  template:
    metadata:
      labels:
        app: hubflow-frontend
    spec:
      containers:
        - name: frontend
          image: registry.example.com/hubflow-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /hubflow
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hubflow-frontend
spec:
  selector:
    app: hubflow-frontend
  ports:
    - port: 80
      targetPort: 80
